id: check_local_dns_resolution_for_arbitrary_host
name: Check local DNS resolution for arbitrary host
version: '1.0'
description: This technique checks DNS resolution from the local machine
documentation: |-
  This technique uses dig to check whether the local node can resolve a given hostname that shoud correspond to a given IP address, typically from the local nameserver.

  The technique takes 3 parameters :

  - hostname to check : mandatory
  - IP address we should get in return (extented regex). Can be either an actual IP address or a regex that would mean “any valid IP address” such as : ([1-9][0-9]{0,2}\.){3}[1-9][0-9]{0,2}
  - nameserver to query. Typically 127.0.0.1 for the local nameserver, or any other if we want to check that our node can get proper replies from a remote DNS server.
category: ncf_techniques
params:
  - id: 70b37652-de2f-46f8-b64b-48d98e9c5b9a
    name: check_host
    description: Check host
    documentation: Hostname that we will try to resolve.
    constraints:
      allow_empty: false
  - id: 4dfb71b7-6100-4e74-9b79-83ad3a9e6a2a
    name: expected_reply
    description: Expected reply IP
    documentation: IP address that we expect in reply, this is an extended regex.
      Use either the actual IP wanted, or  ([1-9][0-9]{0,2}\.){3}[1-9][0-9]{0,2} to
      mean “any valid IPV4 address”.
    constraints:
      allow_empty: false
  - id: 6dc38db7-de27-48b8-95fe-45e78032a900
    name: query_server
    description: DNS server
    documentation: DNS server we want to query. Use 127.0.0.1 for the local node
    constraints:
      allow_empty: false
items:
  - id: 85cec457-d533-4cec-b294-6fca3137ec44
    name: '10 - Check DNS resolution : ${check_host} is ${expected_reply} from server
      ${query_server}'
    method: audit_from_command
    params:
      command: bash -c '[[ \"${const.dollar}(dig @${query_server} ${check_host} A
        +short)\" =~ \"${expected_reply}\" ]]'
      compliant_codes: '0'
